name: Browser and native XPT gate (experimental)
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-feasibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-xpt-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install official distro test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 at-spi2-core python3-pyatspi python3-numpy python3-mido xdotool scrot tesseract-ocr openbox libasound2 libjack-jackd2-0 libxcb-cursor0 fluidsynth timgm6mb-soundfont fonts-noto-cjk
      - name: Install pinned browser test tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Unit checks and original fixtures
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v
          node --test tests/test_browser_core.cjs
          /usr/bin/python3 scripts/build_offline.py
          git diff --exit-code -- pattern-ferry-offline.zip offline-manifest.json
          /usr/bin/python3 scripts/verify_offline.py
          /usr/bin/python3 scripts/prepare_fixtures.py
      - name: Offline UI, keyboard, races, bounds and print evidence
        run: node scripts/browser_test.mjs
      - name: Fetch and verify pinned official LMMS alpha release
        run: |
          mkdir -p .native evidence
          curl --fail --location --retry 2 'https://github.com/LMMS/lmms/releases/download/v1.3.0-alpha.2/lmms-1.3.0-alpha.2-linux-x86_64.AppImage' -o .native/lmms.AppImage
          echo '7580e832b9a10041ef632ebf2d70d588f41c31be8c6c80d1f9a96d1c0871298b  .native/lmms.AppImage' | sha256sum --check | tee evidence/release-integrity.txt
          chmod u+x .native/lmms.AppImage
          cd .native
          ./lmms.AppImage --appimage-extract > ../evidence/extraction.log
          ./squashfs-root/AppRun --version > ../evidence/lmms-version.txt 2>&1
      - name: Official GUI export and import into existing clip
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' bash scripts/hosted_native_gate.sh
      - name: FluidSynth audible note/onset oracle and negative controls
        env:
          PYTHONPATH: .
        run: /usr/bin/python3 scripts/audio_oracle.py
      - name: Collect evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pattern-ferry-native-${{ github.sha }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
